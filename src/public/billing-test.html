<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Test - Razorpay</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
        .test-card-box {
            background: #f0f4ff;
            border: 1px solid #c7d7ff;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 13px;
        }
        .test-card-box h4 { color: #4a5568; margin-bottom: 8px; font-size: 13px; }
        .test-card-box p { color: #555; margin-bottom: 4px; line-height: 1.5; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: #444; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            background: white;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .pay-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .pay-btn:hover { opacity: 0.92; }
        .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .result-box.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .result-box.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💳 Razorpay Payment Test</h1>
        <p class="subtitle">Complete a test payment with Razorpay</p>

        <div class="test-card-box">
            <h4>🧪 Use these test card details inside Razorpay:</h4>
            <p><strong>Card Number:</strong> 4718 6094 0849 6320</p>
            <p><strong>Expiry:</strong> 12/26 &nbsp; <strong>CVV:</strong> 123</p>
            <p><strong>OTP:</strong> 1234 (when asked)</p>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" value="demo@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" value="DemoPassword123!">
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="mobileInput" value="9999999999">
        </div>

        <div class="form-group">
            <label>Plan</label>
            <select id="planSelect">
                <option value="starter">Starter - $29 / month</option>
                <option value="pro" selected>Pro - $99 / month</option>
                <option value="enterprise">Enterprise - $299 / month</option>
            </select>
        </div>

        <div class="form-group">
            <label>Billing Cycle</label>
            <select id="cycleSelect">
                <option value="monthly" selected>Monthly</option>
                <option value="yearly">Yearly</option>
            </select>
        </div>

        <button class="pay-btn" id="payButton">🚀 Start Payment</button>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        var token = null;

        function showMsg(msg, type) {
            var box = document.getElementById('resultBox');
            box.textContent = msg;
            box.className = 'result-box ' + type;
            box.style.display = 'block';
        }

        function resetBtn() {
            var btn = document.getElementById('payButton');
            btn.disabled = false;
            btn.textContent = 'Start Payment';
        }

        document.getElementById('payButton').addEventListener('click', function() {
            var btn = document.getElementById('payButton');
            btn.disabled = true;
            btn.textContent = 'Please wait...';

            var email    = document.getElementById('emailInput').value;
            var password = document.getElementById('passwordInput').value;
            var mobile   = document.getElementById('mobileInput').value;
            var plan     = document.getElementById('planSelect').value;
            var cycle    = document.getElementById('cycleSelect').value;

            showMsg('Step 1: Logging in...', 'success');

            fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.success) {
                    throw new Error('Login failed: ' + data.error.message);
                }
                token = data.data.tokens.accessToken;
                showMsg('Step 1: Login OK\nStep 2: Creating order...', 'success');

                return fetch('/api/v1/billing/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ planSlug: plan, billingCycle: cycle })
                });
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.success) {
                    throw new Error('Order error: ' + data.error.message);
                }

                var orderId    = data.data.orderId;
                var amount     = data.data.amount;
                var currency   = data.data.currency;
                var keyId      = data.data.razorpayKeyId;
                var planName   = data.data.plan.name;
                var planCycle  = data.data.plan.billingCycle;

                showMsg('Step 1: Login OK\nStep 2: Order created: ' + orderId + '\nStep 3: Opening Razorpay...', 'success');

                var options = {
                    key: keyId,
                    amount: amount,
                    currency: currency,
                    name: 'Multi-Tenant SaaS',
                    description: planName + ' (' + planCycle + ')',
                    order_id: orderId,
                    prefill: {
                        name: 'Demo User',
                        email: email,
                        contact: mobile
                    },
                    theme: { color: '#667eea' },
                    handler: function(resp) {
                        showMsg('Step 4: Verifying payment...', 'success');

                        fetch('/api/v1/billing/verify', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token
                            },
                            body: JSON.stringify({
                                razorpay_order_id:   resp.razorpay_order_id,
                                razorpay_payment_id: resp.razorpay_payment_id,
                                razorpay_signature:  resp.razorpay_signature
                            })
                        })
                        .then(function(r) { return r.json(); })
                        .then(function(vData) {
                            if (vData.success) {
                                var endDate = new Date(vData.data.subscription.currentPeriodEnd).toLocaleDateString();
                                showMsg(
                                    'PAYMENT SUCCESSFUL!\n\n' +
                                    'Payment ID : ' + resp.razorpay_payment_id + '\n' +
                                    'Order ID   : ' + resp.razorpay_order_id + '\n' +
                                    'Plan       : ' + vData.data.plan.name + '\n' +
                                    'Amount     : $' + vData.data.plan.amount + '\n' +
                                    'Status     : ' + vData.data.subscription.status + '\n' +
                                    'Valid Until: ' + endDate,
                                    'success'
                                );
                            } else {
                                showMsg('Verification failed:\n' + JSON.stringify(vData.error, null, 2), 'error');
                            }
                            resetBtn();
                        })
                        .catch(function(e) {
                            showMsg('Verify error: ' + e.message, 'error');
                            resetBtn();
                        });
                    },
                    modal: {
                        ondismiss: function() {
                            showMsg('Payment cancelled.', 'error');
                            resetBtn();
                        }
                    }
                };

                var rzp = new Razorpay(options);
                rzp.open();
            })
            .catch(function(e) {
                showMsg('Error: ' + e.message, 'error');
                resetBtn();
            });
        });
    </script>
</body>
</html>
